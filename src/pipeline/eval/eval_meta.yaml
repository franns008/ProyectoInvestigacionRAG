# Metadata del harness de evaluación. Versionado en git.
# Diseño: docs/eval/refactor_resultados_csv.md
schema_version: 1

# Baseline = run_id de una fila de results/runs.csv. Para re-basear, editar esta línea
# (o correr scripts/eval.sh --set-baseline) y commitear.
#
# VIGENTE (2026-10-24): primera corrida completa de la epoch `inputs-produccion-v1`
# (el eval arma los inputs con build_query, como producción). Dataset completo (39),
# 0 errores, 939 docs en el store (CWE parcial + 3 PDFs de INCIBE), qwen2.5:3b-instruct
# local en AMD, temp=0.
#   recall_eff 0.811 · hit_eff 0.864 · mrr_eff 0.693 · source_recall 1.000
#   sas_mean 0.695 (n=26) · abstention_rate 0.000 (n=5)
#
# Contra la última corrida con los inputs viejos sobre el MISMO corpus (20261023T161531Z,
# gemma4-mid): recall 0.796 → 0.811, hit 0.818 → 0.864, mrr 0.678 → 0.693. Es el efecto
# de pasarle los IDs a id_lookup y usar las queries de producción.
#
# PROVISORIO en generación: sas_mean y abstention_rate dependen del LLM, y qwen2.5:3b
# no se abstiene nunca (gemma4-mid daba 0.8). Re-basear esos ejes con el modelo que el
# equipo adopte; Tier 3 (juez) queda sin baseline: con qwen2.5:3b el juez de
# faithfulness no parsea (nan). Retrieval no depende del LLM y sí está firme.
baseline_run_id: 20261024T015349Z

# Epoch vigente: nombre del período de topología actual. Se estampa en cada corrida.
# ¿Cambiaste la topología del pipeline (reranker, chunking, modelo de embeddings,
# componentes)? → declarar acá un nombre nuevo y re-basear.
#
# "Topología" es la FORMA del pipeline, no los valores de los valves: mover top_k
# no cambia de epoch, agregar una etapa nueva sí. La regla existe porque comparar
# corridas de topologías distintas produce deltas que no significan nada (bug H2
# de mejoras_harness.md).
epoch: inputs-produccion-v1

# Historial documental (el código no lo lee; es memoria del proyecto).
epochs:
  - name: pre-reranker
    nota: "híbrido RRF sin cross-encoder"
  - name: reranker-v1
    nota: "bge-reranker-v2-m3; retriever_top_k=15, ranker_top_k=4; embeddings bge-m3 (1024 dims)"
  - name: qwen3-reranker-v1
    nota: >-
      embeddings qwen3-embedding:4b (2560 dims) tras el merge de extract_indexing
      (2026-08-26). Misma forma de pipeline que reranker-v1 — retriever híbrido →
      reranker bge-reranker-v2-m3, retriever_top_k=15, ranker_top_k=4 — pero cambiar
      el modelo de embeddings obliga a reindexar y cambia el espacio vectorial, así
      que los deltas contra reranker-v1 no significan nada. Corpus: 965 docs
      (710 CWE atómicos + 255 chunks de 3 PDFs de INCIBE), 0 CVE.
      Requiere GPU para indexar: en CPU los lotes dan `timed out` y el indexador
      reporta exit 0 perdiendo documentos en silencio.
  - name: inputs-produccion-v1
    nota: >-
      el eval arma los inputs con build_query(), igual que pipe(): ahora pasa los IDs
      de la pregunta a id_lookup (antes aportaba 0 documentos), usa build_embedding_query
      (instrucción de qwen3-embedding) y build_ranker_query. Mismos componentes que
      qwen3-reranker-v1, pero cambia lo que entra a cada uno: los deltas contra esa
      epoch no son comparables. Falta re-basear.
