services:
    ollama:
        image: ollama/ollama
        restart: unless-stopped
        env_file:
           - env/ollama.env
        ports:
           - "${OLLAMA_PORT:-11434}:11434"
        volumes:
            - ollama_data:/root/.ollama

    vdb:
        image: ankane/pgvector
        restart: unless-stopped
        env_file:
            - env/vdb.env
        environment:
            POSTGRES_USER: ${PGVECTOR_USR:-avdbuser}
            POSTGRES_PASSWORD: ${PGVECTOR_PASS:-avdbpass}
        ports:
            - "${VDB_PORT:-5433}:5432"
        volumes:
            - pgv_data:/var/lib/postgresql/data

    pipelines:
        build:
            context: ..
            dockerfile: infrastructure/Dockerfile.pipelines
        restart: unless-stopped
        environment:
            TORCH_DEVICE: cpu
            # Modelo de generación en el Ollama local. Vacío = el default del
            # pipeline (DEFAULT_OLLAMA_LLM). Ver docs/arquitectura.md.
            LLM_MODEL: ${LLM_MODEL:-}
            # Ventana de contexto del LLM. Vacío = el valve num_ctx; 0 = la del Modelfile.
            LLM_NUM_CTX: ${LLM_NUM_CTX:-}
            PIPELINES_API_KEY: ${PIPESERVER_KEY:-0p3n-w3bui}
        ports:
            - "${PIPELINES_PORT:-9099}:9099"
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - pipelines:/app/pipelines
            - rawdata:/app/pipelines/rawdata
        depends_on:
            - vdb
            - ollama

volumes:
    ollama_data:
        driver: local
        driver_opts:
            type: 'none'
            o: 'bind'
            device: ./appdata/ollama/
    pgv_data:
        driver: local
        driver_opts:
            type: 'none'
            o: 'bind'
            device: ./appdata/postgress_vector/
    pipelines:
        driver: local
        driver_opts:
            type: 'none'
            o: 'bind'
            device: ../src/pipeline/
    rawdata:
        driver: local
        driver_opts:
            type: 'none'
            o: 'bind'
            device: ../data/raw/
