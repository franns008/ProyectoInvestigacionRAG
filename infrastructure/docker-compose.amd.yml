# Override para máquinas con GPU AMD sin ROCm (p. ej. RX 570 / Polaris, gfx803) vía Vulkan.
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.amd.yml up -d --build
# Requiere Mesa con RADV en el host: `vulkaninfo --summary | grep deviceName` debe listar
# la placa. El compose base (docker-compose.yml) corre todo en CPU y no necesita esto.
#
# A diferencia del override NVIDIA, este no le da GPU a `pipelines`: torch no tiene backend
# Vulkan y ROCm no soporta gfx803, así que el reranker sigue en CPU y no hace falta
# rebuildear la imagen. Sólo se acelera Ollama (generación + embeddings).
#
# La GPU (4 GB) queda para el LLM. El embedder vive en CPU o en GPU según el modo, igual
# que en docker-compose.nvidia-3gb.yml. Se cambia de modo con EMBEDDING_MODEL y 'up -d'
# (sin rebuild):
#
#   MODO CONSULTA (default) — embeber la pregunta es un solo texto corto:
#       EMBEDDING_MODEL=qwen3-embedding:4b-cpu       -> CPU
#
#   MODO INDEXACIÓN — sólo mientras corre run_indexing.py (son miles de chunks):
#       EMBEDDING_MODEL=qwen3-embedding:4b-ctx512 docker compose \
#           -f docker-compose.yml -f docker-compose.amd.yml up -d
#
# Son los mismos pesos con otros parámetros: los vectores no cambian entre modos.
# REQUIERE los modelos derivados (crear una sola vez; comparten los blobs del base):
#
#   printf 'FROM qwen3-embedding:4b\nPARAMETER num_ctx 512\n' > /tmp/mf
#   docker compose exec -T ollama sh -c 'cat > /tmp/mf' < /tmp/mf
#   docker compose exec ollama ollama create qwen3-embedding:4b-ctx512 -f /tmp/mf
#
#   printf 'FROM qwen3-embedding:4b\nPARAMETER num_gpu 0\nPARAMETER num_ctx 512\n' > /tmp/mf
#   docker compose exec -T ollama sh -c 'cat > /tmp/mf' < /tmp/mf
#   docker compose exec ollama ollama create qwen3-embedding:4b-cpu -f /tmp/mf
#
# num_ctx 512 hace entrar el embedder en GPU (33/37 capas contra 0/37 con el default) y
# trunca ~0,5% de los CVE (p99 = 396 tokens).
services:
    pipelines:
        environment:
            # Indexación y consulta leen la MISMA variable: con modelos distintos los
            # vectores no matchean. Default = MODO CONSULTA (ver arriba).
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:4b-cpu}
            # Leídas por src/pipeline/indexing/run_indexing.py; sin el overlay rigen sus
            # defaults (64 / 2 / 120 s).
            # Lotes chicos: si parte del modelo cae a CPU, el request igual entra en el timeout.
            EMBED_BATCH_SIZE: "16"
            # <= OLLAMA_NUM_PARALLEL (abajo lo bajamos a 1).
            EMBED_CONCURRENCY: "1"
            EMBED_TIMEOUT_SECONDS: "900"

    ollama:
        # Vulkan sobre RADV sólo necesita el nodo de render. /dev/kfd es para ROCm/HSA
        # (la doc de Ollama lo pasa porque documenta ese caso); acá no aplica.
        devices:
            - /dev/dri:/dev/dri
        # GIDs NUMÉRICOS a propósito: con nombres, Docker los busca en el /etc/group
        # del *container*, y la imagen de Ollama no tiene un grupo `render`
        # ("unable to find group render"). Los números no necesitan esa búsqueda.
        # Los defaults son los de Fedora; en otras distros cambian (Debian/Ubuntu
        # suele usar video=44). Averiguá los tuyos con `getent group render video`
        # y overrideálos en el .env si no coinciden.
        group_add:
            - "${RENDER_GID:-105}"
            - "${VIDEO_GID:-39}"
        # `environment` le gana a `env_file`, así que esto pisa a env/ollama.env sin
        # tocar ese archivo (que sigue sirviendo al resto del grupo).
        environment:
            # Redundante en Ollama >= 0.12.11 (Vulkan se activa solo al ver los devices),
            # explícito como documentación y por si la imagen :latest quedara atrás.
            OLLAMA_VULKAN: "1"
            # Con el embedder en CPU, embedder y LLM entran a la vez: los dos quedan
            # residentes (KEEP_ALIVE=-1, como en env/ollama.env) y no se paga la recarga
            # en cada consulta. env/ollama.env asume 12 GB de VRAM con NUM_PARALLEL=2;
            # con 4 GB se baja a 1.
            OLLAMA_KEEP_ALIVE: "-1"
            OLLAMA_NUM_PARALLEL: "1"
            # VRAM que el loader de llama.cpp deja libre al repartir capas (--fit-target).
            # Default 1024 MiB. Con 256 entra gemma4:e4b-text entero (43/43 capas, hasta
            # 12k de contexto); con 1024 queda en 36/43. Es global para todos los modelos y
            # sin margen el escritorio puede dejar sin VRAM al load: bajarlo sólo con pocas
            # cosas abiertas. Se fija con FIT_TARGET_MIB en el .env.
            LLAMA_ARG_FIT_TARGET: "${FIT_TARGET_MIB:-1024}"
