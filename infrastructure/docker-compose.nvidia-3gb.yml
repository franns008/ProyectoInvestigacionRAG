# Override para GPU NVIDIA con poca VRAM (3 GB): reparto fijo CPU/GPU con el embedder y el
# generador residentes, en modo consulta o indexación. Modos, mediciones y los modelos
# derivados que requiere: docs/arquitectura.md §8.3.
#
#   docker compose -f docker-compose.yml -f docker-compose.nvidia-3gb.yml up -d   # sin --build
services:
    ollama:
        environment:
            # Los DOS modelos residentes a la vez: sin esto ollama desaloja uno para
            # cargar el otro y se pierden ~3 s por consulta.
            OLLAMA_MAX_LOADED_MODELS: "2"
            # Residentes indefinidamente (es el default de env/ollama.env; se explicita
            # acá porque todo el plan depende de que NO se descarguen).
            OLLAMA_KEEP_ALIVE: "-1"
            # Acompaña a EMBED_CONCURRENCY=2 de run_indexing.py: en modo indexación
            # sube el throughput un 25% (141 -> 176 chunks/min) y sigue entrando en 3 GB.
            OLLAMA_NUM_PARALLEL: "2"
            # Pascal (compute 6.1) no soporta flash attention en ollama.
            OLLAMA_FLASH_ATTENTION: "false"
        deploy:
            resources:
                reservations:
                    devices:
                      - driver: nvidia
                        count: 1
                        capabilities: [gpu]

    pipelines:
        environment:
            # Variante del embedder según el modo (ver arriba). Indexación y query leen
            # la MISMA variable: con modelos distintos los vectores no matchean.
            # Defaults = MODO CONSULTA, para que ande sin .env. Para indexar se pisan al
            # levantar: EMBEDDING_MODEL=qwen3-embedding:4b-ctx512 LLM_MODEL=qwen2.5:1.5b-instruct-cpu
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:4b-cpu}
            LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b-instruct}
            # Indexación (las lee run_indexing.py). Con el escritorio usando la placa el
            # embedder queda ~20% en CPU y un lote de 64 no entra en 120 s: lotes chicos,
            # de a uno y con timeout largo (mismos valores que el overlay AMD).
            EMBED_BATCH_SIZE: "16"
            EMBED_CONCURRENCY: "1"
            EMBED_TIMEOUT_SECONDS: "900"
