# Override para GPU NVIDIA con POCA VRAM (probado en GTX 1050 3 GB / Ryzen 5 4600H).
#
# En 3 GB no entran el embedder (2.5 GB) y el generador (1.0 GB) a la vez, y turnarlos
# cuesta ~3 s de carga por consulta. La salida es un reparto FIJO CPU/GPU con los dos
# modelos residentes: cada uno vive donde más rinde. Como qué conviene poner en la GPU
# cambia entre indexar y consultar, hay DOS MODOS. Se cambia de modo editando
# LLM_MODEL / EMBEDDING_MODEL en .env y haciendo 'up -d' (no hace falta rebuild).
#
#   MODO CONSULTA (default) — el de todos los días:
#       EMBEDDING_MODEL=qwen3-embedding:4b-cpu       -> CPU   (1 embedding por pregunta)
#       LLM_MODEL=qwen2.5:1.5b-instruct              -> GPU   1.5 GB VRAM
#
#   MODO INDEXACIÓN — sólo mientras corre run_indexing.py (son miles de chunks):
#       EMBEDDING_MODEL=qwen3-embedding:4b-ctx512    -> GPU   2.6 GB VRAM
#       LLM_MODEL=qwen2.5:1.5b-instruct-cpu          -> CPU
#
# Medido en esta máquina:
#   - Embedding: 3.46 s/chunk en CPU vs 0.46 en GPU (7.5x). Por eso la indexación
#     quiere la placa: 965 docs pasaron de ~1 h a 6 min.
#   - Generación: 31 tok/s en CPU vs 33 en GPU (nada). Lo que sí gana es el prompt
#     processing: 104 tok/s en CPU vs 782 en GPU (7.5x).
#   - OJO: el costo dominante de una consulta NO es el LLM sino el reranker en CPU
#     (3-17 s según el largo de los docs, proporcional a retriever_top_k). Ver abajo.
#
# 'pipelines' se queda en CPU a propósito: NO se rebuildea con torch CUDA. Eso ahorra
# ~3 GB de imagen, que esta máquina no tiene (5.4 GB libres en /). El precio es que el
# reranker bge-reranker-v2-m3 corre en CPU y domina la latencia de consulta. Si algún
# día sobra disco, pasarlo a GPU es la mejora más grande disponible; mientras tanto,
# bajar retriever_top_k de 15 a 8 corta la consulta a la mitad (11.6 s -> 6.2 s) a
# costa de recall — decidirlo con el harness de eval, no a ojo.
#
# REQUIERE los modelos derivados (crear una sola vez; NO ocupan disco extra porque
# comparten los blobs con sus modelos base):
#
#   printf 'FROM qwen3-embedding:4b\nPARAMETER num_ctx 512\n' > /tmp/mf
#   docker compose exec -T ollama sh -c 'cat > /tmp/mf' < /tmp/mf
#   docker compose exec ollama ollama create qwen3-embedding:4b-ctx512 -f /tmp/mf
#
#   printf 'FROM qwen3-embedding:4b\nPARAMETER num_gpu 0\nPARAMETER num_ctx 512\n' > /tmp/mf
#   docker compose exec -T ollama sh -c 'cat > /tmp/mf' < /tmp/mf
#   docker compose exec ollama ollama create qwen3-embedding:4b-cpu -f /tmp/mf
#
#   printf 'FROM qwen2.5:1.5b-instruct\nPARAMETER num_gpu 0\n' > /tmp/mf
#   docker compose exec -T ollama sh -c 'cat > /tmp/mf' < /tmp/mf
#   docker compose exec ollama ollama create qwen2.5:1.5b-instruct-cpu -f /tmp/mf
#
# num_ctx 512 en el embedder no es cosmético: con el default de 4096 el KV cache se
# come 1.3 GB y el modelo queda en 30%/70% CPU/GPU. Los chunks son de 200 palabras
# (~300 tokens), así que 512 sobra. Son los mismos pesos: los vectores no cambian.
#
# Uso (NO lleva --build; con --build se dispara el rebuild CUDA y no hay disco):
#   docker compose -f docker-compose.yml -f docker-compose.nvidia-3gb.yml up -d
services:
    ollama:
        environment:
            # Los DOS modelos residentes a la vez: sin esto ollama desaloja uno para
            # cargar el otro y se pierden ~3 s por consulta.
            OLLAMA_MAX_LOADED_MODELS: "2"
            # Residentes indefinidamente (es el default de env/ollama.env; se explicita
            # acá porque todo el plan depende de que NO se descarguen).
            OLLAMA_KEEP_ALIVE: "-1"
            # Acompaña a EMBED_CONCURRENCY=2 de run_indexing.py: en modo indexación
            # sube el throughput un 25% (141 -> 176 chunks/min) y sigue entrando en 3 GB.
            OLLAMA_NUM_PARALLEL: "2"
            # Pascal (compute 6.1) no soporta flash attention en ollama.
            OLLAMA_FLASH_ATTENTION: "false"
        deploy:
            resources:
                reservations:
                    devices:
                      - driver: nvidia
                        count: 1
                        capabilities: [gpu]

    pipelines:
        environment:
            # Variante del embedder según el modo (ver arriba). Indexación y query leen
            # la MISMA variable: con modelos distintos los vectores no matchean.
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:4b}
